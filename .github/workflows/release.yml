name: Automated Release

on:
  push:
    branches:
      - main
      - fix/quality-pass
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Publish Automated Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build hatchling

      - name: Determine Release Tag
        id: versioning
        shell: bash
        run: |
          # Read base version from pyproject.toml
          BASE_VERSION=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          print(data.get('project', {}).get('version', '0.1.0'))
          ")
          
          # If triggered by a git tag, use that tag.
          # Otherwise generate a monotonic, unique release tag: v<base_version>.<run_number>
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            RELEASE_TAG="v${BASE_VERSION}.${{ github.run_number }}"
          fi
          
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "base_version=${BASE_VERSION}" >> $GITHUB_OUTPUT
          echo "Computed release tag: ${RELEASE_TAG}"

      - name: Build Packages (Wheel & sdist)
        run: |
          python -m build

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.release_tag }}
          name: "Release ${{ steps.versioning.outputs.release_tag }}"
          generate_release_notes: true
          make_latest: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
