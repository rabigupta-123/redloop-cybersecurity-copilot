name: Automated Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish Automated Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build hatchling pytest PyYAML pydantic cryptography

      - name: Verify Secret Hygiene
        run: |
          python scripts/scan_secrets.py --all

      - name: Validate and Determine Release Tag
        id: versioning
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            PROPOSED_TAG="${GITHUB_REF#refs/tags/}"
            echo "Validating incoming release tag: ${PROPOSED_TAG}"
            python scripts/validate_release_tag.py --candidate "${PROPOSED_TAG}"
            RELEASE_TAG="${PROPOSED_TAG}"
          else
            echo "Non-tag trigger (workflow_dispatch); computing next safe patch tag..."
            RELEASE_TAG=$(python scripts/validate_release_tag.py --compute-next)
          fi
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "Computed release tag: ${RELEASE_TAG}"

      - name: Build Packages (Wheel & sdist)
        run: |
          python -m build

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/*
          retention-days: 90

      - name: Create or Update GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.release_tag }}
          name: "Release ${{ steps.versioning.outputs.release_tag }}"
          generate_release_notes: true
          make_latest: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
