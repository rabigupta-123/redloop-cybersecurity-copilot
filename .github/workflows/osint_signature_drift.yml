name: OSINT Signature Drift Monitor

on:
  schedule:
    # Weekly every Monday at 04:15 UTC
    - cron: '15 4 * * 1'
  workflow_dispatch:
    inputs:
      clean_baseline:
        description: 'Run against clean baseline without upstream redesign drift fixtures'
        required: false
        default: 'false'

permissions:
  contents: read
  issues: write

jobs:
  signature-drift-check:
    name: Verify Platform Exists/Not-Found Signatures (2 True + 2 False per Platform)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,dashboard,recon]"

      - name: Run OSINT Signature Drift Monitor
        id: drift_check
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.clean_baseline }}" = "true" ]; then
            EXTRA_ARGS="--clean-baseline"
          fi
          python scripts/monitor_osint_signature_drift.py \
            --output-json artifacts/osint_signature_drift_status.json \
            --output-md artifacts/osint_signature_drift_status.md \
            $EXTRA_ARGS
          cat artifacts/osint_signature_drift_status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Signature Drift Status Artifact
        uses: actions/upload-artifact@v4
        with:
          name: osint-signature-drift-status
          path: |
            artifacts/osint_signature_drift_status.json
            artifacts/osint_signature_drift_status.md
          retention-days: 30
