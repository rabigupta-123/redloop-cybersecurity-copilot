name: Full Test Suite (Nightly & Manual)

on:
  schedule:
    - cron: '0 2 * * *'  # Run nightly at 02:00 UTC
  workflow_dispatch:

jobs:
  full-test-suite:
    name: Full Test Suite (1,260 Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,dashboard,recon]"
          python -m pip install mcp sentence-transformers pytest-asyncio anyio locust mypy sqlalchemy pydantic-settings

      - name: Run Full Test Suite
        run: |
          pytest -v -m "not integration"

