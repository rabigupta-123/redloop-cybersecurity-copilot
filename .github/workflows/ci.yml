name: CI

on:
  push:
    branches:
      - main
      - feat/*
      - fix/*
  pull_request:
    branches:
      - main

jobs:
  security-and-tests:
    name: Security Scan & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,dashboard,recon]"
          python -m pip install mcp sentence-transformers pytest-asyncio anyio locust

      - name: Secret Scanner Check
        run: |
          python scripts/scan_secrets.py --all

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --desc || echo "::warning::Advisories reported by pip-audit; documented in SECRETS_REPORT.md"

      - name: Run Tests
        run: |
          pytest -v

