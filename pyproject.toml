[project]
name = "redloop"
version = "0.2.1"
description = "Locally-run autonomous security testing agent for authorized pentesting, learning labs, and CTFs."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "RedLoop" }]
# SPDX-License-Identifier: MIT
license = { text = "MIT" }
keywords = ["security", "pentest", "agent", "ollama", "langgraph"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "litellm>=1.44",
    "python-dotenv>=1",
    "docker>=7",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "pytest-asyncio>=0.23",
    "anyio>=4",
    "pytest-cov>=5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "mcp>=1.0.0",
    "sentence-transformers>=2.2.0",
    "locust>=2.20.0",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "pypdf>=5",
    "python-nmap>=0.7.1",
    "dnspython>=2.6.1",
]
forensics = ["yara-python>=4.5"]
dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "pypdf>=5",
]
learning-service = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2",
    "python-multipart>=0.0.9",
    "openai>=1",
]
streamlit-dashboard = [
    "streamlit>=1.35",
    "pandas>=2",
    "plotly>=5",
    "requests>=2",
]
recon = ["python-nmap>=0.7.1", "dnspython>=2.6.1"]

[project.scripts]
redloop = "redloop.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redloop"]

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[tool.pytest.ini_options]
testpaths = ["tests", "self-learning-agent/tests"]
pythonpath = [".", "src", "self-learning-agent"]
timeout = 120
markers = [
    "integration: uses real localhost services or installed local dependencies",
]
filterwarnings = [
    "ignore:.*Using `httpx` with `starlette.testclient`.*:DeprecationWarning",
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
disable_error_code = [
    "arg-type",
    "attr-defined",
    "union-attr",
    "assignment",
    "index",
    "operator",
    "return-value",
    "var-annotated",
    "misc",
    "call-arg",
    "call-overload",
    "dict-item",
    "typeddict-item",
]